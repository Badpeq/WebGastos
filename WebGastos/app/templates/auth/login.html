<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — WebGastos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { base: '#0D1117', card: '#161B2E', elevated: '#1E2640' },
            'app-border': '#2A3050',
            content:  { primary: '#EDF0FF', muted: '#7C85A8' },
            fin:      { green: '#00E5A0', red: '#FF3B6B' },
            accent:   { DEFAULT: '#6C63FF', light: '#9189FF' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { background-color: #0D1117; }
  </style>
</head>

<body class="h-full font-sans antialiased text-content-primary
             flex items-center justify-center p-4
             bg-[radial-gradient(ellipse_at_top,_#1E2640_0%,_#0D1117_60%)]">

  <div class="w-full max-w-sm" x-data="{ pwVisible: false }">

    <!-- Logo + brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl
                  bg-accent shadow-lg shadow-accent/40 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0
                   1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12
                   12 12c-.725 0-1.45-.22-2.003-.659-1.172-.879-1.172-2.303
                   0-3.182.582-.436 1.328-.654 2.003-.654.725 0 1.45.22 2.003.659"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-content-primary tracking-tight">WebGastos</h1>
      <p class="text-sm text-content-muted mt-1">Tu radar financiero personal</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-5 space-y-2">
        {% for category, message in messages %}
        <div class="px-4 py-3 rounded-xl text-sm font-medium
                    {% if category == 'success' %}
                      bg-fin-green/10 border border-fin-green/30 text-fin-green
                    {% elif category == 'danger' or category == 'error' %}
                      bg-fin-red/10 border border-fin-red/30 text-fin-red
                    {% else %}
                      bg-accent/10 border border-accent/30 text-accent
                    {% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <!-- Card del formulario -->
    <div class="bg-surface-card border border-app-border rounded-2xl p-7 shadow-2xl">

      <form method="POST" action="{{ url_for('auth_bp.login') }}" class="space-y-5">

        <!-- Email -->
        <div>
          <label for="email" class="block text-xs font-semibold text-content-muted uppercase tracking-wider mb-2">
            Correo electrónico
          </label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 placeholder="tu@correo.com"
                 class="w-full bg-surface-elevated border border-app-border rounded-xl
                        px-4 py-3 text-sm text-content-primary placeholder-content-muted/60
                        focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50
                        transition-colors">
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="block text-xs font-semibold text-content-muted uppercase tracking-wider mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input :type="pwVisible ? 'text' : 'password'"
                   id="password" name="password" required autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full bg-surface-elevated border border-app-border rounded-xl
                          px-4 py-3 pr-11 text-sm text-content-primary placeholder-content-muted/60
                          focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/50
                          transition-colors">
            <!-- Toggle visibilidad -->
            <button type="button"
                    @click="pwVisible = !pwVisible"
                    class="absolute right-3 top-1/2 -translate-y-1/2
                           text-content-muted hover:text-content-primary transition-colors">
              <svg x-show="!pwVisible" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638
                         0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5
                         12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <svg x-show="pwVisible" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5
                         12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45
                         0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523
                         0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894
                         7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242
                         4.242L9.88 9.88"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full flex items-center justify-center gap-2 bg-accent hover:bg-accent-light
                       text-white font-semibold text-sm py-3 px-6 rounded-xl
                       transition-colors shadow-lg shadow-accent/30 mt-2">
          Ingresar
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
          </svg>
        </button>

      </form>
    </div>

  </div>
</body>
</html>
