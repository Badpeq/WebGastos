<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Genera boletas de pago para trabajadores del hogar según Ley 27986. 100% privado, sin servidor.">
<title>NóminaHogar Perú</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- App CSS -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">

<!-- CDN libraries (globals antes del módulo) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ══ MODO EMPLEADOR ════════════════════════════ -->
  <div id="modo-empleador">

    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <path d="M9 9h6M9 12h6M9 15h4"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">NóminaHogar</div>
          <div class="brand-sub">Ley 27986 · Perú</div>
        </div>
      </div>
      <button class="btn btn-secundario btn-sm" id="btn-empleador" title="Datos del empleador y firmas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Empleador
      </button>
    </header>

    <nav class="tab-bar" role="tablist">
      <button class="tab-btn activo" data-tab="boleta" role="tab" aria-selected="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
        Boleta
      </button>
      <button class="tab-btn" data-tab="trabajadores" role="tab" aria-selected="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-2px;margin-right:4px"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Trabajadores
      </button>
      <button class="tab-btn" data-tab="historial" role="tab" aria-selected="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-2px;margin-right:4px"><path d="M12 2v10l4 4"/><circle cx="12" cy="12" r="10"/></svg>
        Historial <span class="badge-count">0</span>
      </button>
      <button class="tab-btn" data-tab="costos" role="tab" aria-selected="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:-2px;margin-right:4px"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
        Costos
      </button>
    </nav>

    <div class="panel-content">

      <!-- Panel: Boleta (wizard) -->
      <div id="panel-boleta" class="panel activo" role="tabpanel">
        <div class="wizard-wrap" id="wizard-wrap">
          <div style="padding:3rem;text-align:center;color:var(--muted)">Cargando…</div>
        </div>
      </div>

      <!-- Panel: Trabajadores -->
      <div id="panel-trabajadores" class="panel" role="tabpanel"></div>

      <!-- Panel: Historial -->
      <div id="panel-historial" class="panel" role="tabpanel"></div>

      <!-- Panel: Costos -->
      <div id="panel-costos" class="panel" role="tabpanel"></div>

    </div>
  </div><!-- /modo-empleador -->

  <!-- ══ MODO TRABAJADOR ═══════════════════════════ -->
  <div id="modo-trabajador" hidden></div>

</div><!-- /app -->

<!-- Boleta oculta para captura PDF -->
<div id="boleta-oculta" aria-hidden="true"></div>

<!-- Frame de impresión -->
<div id="print-frame" aria-hidden="true"></div>

<!-- Toast -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Entry point -->
<script type="module" src="js/main.js"></script>
</body>
</html>
